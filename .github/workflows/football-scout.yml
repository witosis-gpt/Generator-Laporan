name: Football Scout Cloud Run

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade LanusStats pandas openpyxl nodriver
      - name: Run scouting harvester
        run: python football_scout/fotmob_cloud_harvester.py
      - name: Upload scouting output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotmob-scout-output
          path: football_scout/output
          if-no-files-found: warn
